packages:
  - tests/integration/*

# Supply-chain policy (pnpm 11 reads these from this file, not from package.json).
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - "@vllnt/*"

allowBuilds:
  esbuild: true

# Patched releases for transitives that cannot move on their own (eslint-plugin-boundaries@5 pins handlebars 4.7.8; eslint-plugin-functional@9 caps deepmerge-ts at ^7).
overrides:
  "handlebars@<4.7.10": 4.7.10
  "deepmerge-ts@<8.0.0": 8.0.2
