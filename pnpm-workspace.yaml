packages:
  - tests/integration/*

# Supply-chain policy (pnpm 11 reads these from this file, not from package.json).
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - "@vllnt/*"
  # 2026-11-16: the maintainer authorized prettier 3.10.1 (published 2026-11-12) before the 7-day window ends. Exact version only; remove this entry after 2026-11-19, when 3.10.1 is old enough.
  - "prettier@3.10.1"

allowBuilds:
  esbuild: false

# Patched releases for transitives that cannot move on their own (eslint-plugin-boundaries@5 pins handlebars 4.7.8; eslint-plugin-functional@9 caps deepmerge-ts at ^7).
overrides:
  "handlebars@<4.7.10": 4.7.10
  "deepmerge-ts@<8.0.0": 8.0.2
