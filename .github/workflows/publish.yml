name: Publish

# Canary: every push to main touching the package, or a manual run on main.
# Stable (@latest): only a pushed vX.Y.Z tag whose commit is on main and matches
# package.json and a CHANGELOG.md entry. Both use npm trusted publishing (OIDC)
# with provenance; this workflow holds no npm token.

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    # Not evaluated for tag pushes.
    paths:
      - "base.json"
      - "nextjs.json"
      - "nodejs.json"
      - "node-library.json"
      - "react.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  canary:
    name: Publish Canary
    needs: quality
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org

      - name: Install OIDC-capable npm
        run: |
          npm install --global --prefix "$RUNNER_TEMP/npm-cli" npm@12.0.2
          "$RUNNER_TEMP/npm-cli/bin/npm" --version
          echo "$RUNNER_TEMP/npm-cli/bin" >> "$GITHUB_PATH"

      - name: Publish canary
        run: |
          set -euo pipefail
          sed -i '/_authToken/d' "$NPM_CONFIG_USERCONFIG"
          unset NODE_AUTH_TOKEN

          PKG=$(node -p "require('./package.json').name")
          BASE_VERSION=$(node -p "require('./package.json').version")
          # A canary of an already-published version is work toward the next patch, so it
          # must sort above that release.
          if [ -n "$(npm view "${PKG}@${BASE_VERSION}" version 2>/dev/null || true)" ]; then
            BASE_VERSION=$(node -e "const v=require('./package.json').version.split('.').map(Number); console.log(v[0]+'.'+v[1]+'.'+(v[2]+1))")
          fi
          VERSION="${BASE_VERSION}-canary.${GITHUB_SHA::7}"
          npm version "$VERSION" --no-git-tag-version --ignore-scripts

          PACK_RESULT=$(npm pack --ignore-scripts --json --pack-destination "$RUNNER_TEMP")
          IFS=$'\t' read -r TARBALL_NAME LOCAL_INTEGRITY < <(
            echo "$PACK_RESULT" | node -e 'let input=""; process.stdin.on("data", chunk => input += chunk); process.stdin.on("end", () => { const parsed = JSON.parse(input); const item = Array.isArray(parsed) ? parsed[0] : Object.values(parsed)[0]; if (!item?.filename || !item?.integrity) process.exit(1); console.log(`${item.filename}\t${item.integrity}`); })'
          )
          REMOTE_INTEGRITY=$(npm view "${PKG}@${VERSION}" dist.integrity 2>/dev/null || true)

          # Re-runs of the same commit must not republish.
          if [ -n "$REMOTE_INTEGRITY" ]; then
            test "$LOCAL_INTEGRITY" = "$REMOTE_INTEGRITY"
            test "$(npm view "$PKG" dist-tags.canary)" = "$VERSION"
          else
            npm publish "$RUNNER_TEMP/$TARBALL_NAME" --tag canary --provenance --access public --ignore-scripts
          fi

  release:
    name: Publish Stable Release
    needs: quality
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org

      - name: Verify release tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::package.json version $VERSION is not a stable semver"; exit 1; }
          [ "$TAG" = "v$VERSION" ] || { echo "::error::tag $TAG does not match package.json version $VERSION"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$TAG is not on main"; exit 1; }
          grep -qF "## [$VERSION]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no [$VERSION] entry"; exit 1; }
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"

      - name: Install OIDC-capable npm
        run: |
          npm install --global --prefix "$RUNNER_TEMP/npm-cli" npm@12.0.2
          "$RUNNER_TEMP/npm-cli/bin/npm" --version
          echo "$RUNNER_TEMP/npm-cli/bin" >> "$GITHUB_PATH"

      - name: Publish or reconcile npm package
        run: |
          set -euo pipefail
          sed -i '/_authToken/d' "$NPM_CONFIG_USERCONFIG"
          unset NODE_AUTH_TOKEN

          PKG=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          PACK_RESULT=$(npm pack --ignore-scripts --json --pack-destination "$RUNNER_TEMP")
          IFS=$'\t' read -r TARBALL_NAME LOCAL_INTEGRITY < <(
            echo "$PACK_RESULT" | node -e 'let input=""; process.stdin.on("data", chunk => input += chunk); process.stdin.on("end", () => { const parsed = JSON.parse(input); const item = Array.isArray(parsed) ? parsed[0] : Object.values(parsed)[0]; if (!item?.filename || !item?.integrity) process.exit(1); console.log(`${item.filename}\t${item.integrity}`); })'
          )
          REMOTE_INTEGRITY=$(npm view "${PKG}@${VERSION}" dist.integrity 2>/dev/null || true)

          # Re-runs after a later step failed must not try to republish.
          if [ -n "$REMOTE_INTEGRITY" ]; then
            test "$LOCAL_INTEGRITY" = "$REMOTE_INTEGRITY"
            test "$(npm view "$PKG" dist-tags.latest)" = "$VERSION"
          else
            npm publish "$RUNNER_TEMP/$TARBALL_NAME" --tag latest --provenance --access public --ignore-scripts
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
